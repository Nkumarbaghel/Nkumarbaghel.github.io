<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Enquiry | CG Neel Baghel</title><style>body{font-family:system-ui,Arial;background:#080808;color:#fff;margin:0;padding:24px}.box{max-width:650px;margin:auto;background:#121214;padding:24px;border-radius:20px}h1{margin-top:0}label{display:block;margin-top:14px;font-weight:700}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #444;background:#1b1b1f;color:#fff}button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;background:#e91b2b;color:#fff;font-weight:800;font-size:16px}small{color:#aaa}</style></head><body><div class="box"><h1>📢 Business Enquiry</h1><p>Business Promotion, Directory या Sponsored Post के लिए अपनी जानकारी भेजें।</p><form id="f"><label>आपका नाम<input name="name" required></label><label>Business का नाम<input name="business" required></label><label>Mobile Number<input name="mobile" required inputmode="tel"></label><label>City / Address<input name="city"></label><label>Service<select name="service"><option>Business Promotion</option><option>Business Directory</option><option>Sponsored Post / Advertisement</option></select></label><label>Package / Requirement<input name="package" placeholder="जैसे ₹299 Promotion"></label><label>Message<textarea name="message" rows="5"></textarea></label><button>WhatsApp पर Enquiry भेजें</button></form><small>Submit करने पर WhatsApp खुलेगा और तैयार संदेश आपके नंबर पर भेजने के लिए मिलेगा।</small></div><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);let msg=`🔔 New Business Enquiry%0A%0AName: ${d.get('name')}%0ABusiness: ${d.get('business')}%0AMobile: ${d.get('mobile')}%0ACity: ${d.get('city')}%0AService: ${d.get('service')}%0APackage: ${d.get('package')}%0AMessage: ${d.get('message')}`;window.location.href='https://wa.me/919425516616?text='+msg}</script></body></html>
