<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मेरे लेख & ब्लॉग | CG Neel Baghel</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="blog-style.css">


<style>

/* =====================================================
   CG NEEL BAGHEL - BLOG PAGE
   HEADER / NAVBAR FIX
===================================================== */


/* =========================
   HEADER
========================= */

header {
    width: 100%;
    position: relative;
    z-index: 9999;

    background: #080808;

    border-bottom: 1px solid rgba(255,255,255,0.08);
}


/* =========================
   NAVBAR
========================= */

.navbar {

    width: min(1100px, 92%);

    min-height: 68px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


/* =========================
   BRAND
========================= */

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #ffffff;

    text-decoration: none;

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;
}


.brand img {

    width: 44px;

    height: 44px;

    object-fit: cover;

    border-radius: 50%;

    display: block;
}


.brand span {

    color: #ffffff;

    font-weight: 700;
}


/* =========================
   DESKTOP NAVIGATION
========================= */

#nav {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 26px;
}


#nav a {

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    transition: all 0.3s ease;
}


#nav a:hover {

    color: #ff2027;

}


#nav a.active {

    color: #ff2027;

}


/* =========================
   HAMBURGER BUTTON
========================= */

.menu-btn {

    display: none;

    width: 42px;

    height: 42px;

    padding: 0;

    border: none;

    background: transparent;

    color: #ffffff;

    font-size: 30px;

    line-height: 42px;

    text-align: center;

    cursor: pointer;
}


/* =====================================================
   BLOG ADMIN BUTTON
===================================================== */

.admin-panel-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    margin-top: 22px;

    padding: 12px 22px;

    background: #ff1e25;

    color: #ffffff !important;

    border: 1px solid #ff1e25;

    border-radius: 10px;

    text-decoration: none;

    font-size: 15px;

    font-weight: 700;

    transition: all 0.3s ease;

    box-shadow:
        0 8px 25px rgba(255, 30, 37, 0.18);
}


.admin-panel-btn:hover {

    background: transparent;

    color: #ff1e25 !important;

    transform: translateY(-3px);

    box-shadow:
        0 12px 30px rgba(255, 30, 37, 0.25);
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    width: 100%;

    margin-top: 80px;

    padding: 35px 20px;

    background: #080808;

    border-top: 1px solid rgba(255,255,255,0.08);

    text-align: center;

    box-sizing: border-box;
}


footer p {

    margin: 8px 0;

    color: #aaaaaa;

    font-size: 14px;

    line-height: 1.7;
}


footer a {

    display: inline-block;

    margin: 0 8px;

    color: #ffffff;

    text-decoration: none;

    font-size: 14px;

    transition: 0.3s ease;
}


footer a:hover {

    color: #ff2027;

}


/* =====================================================
   MOBILE NAVIGATION
===================================================== */

@media (max-width: 768px) {


    /* NAVBAR */

    .navbar {

        width: 92%;

        min-height: 68px;

        position: relative;
    }


    /* BRAND */

    .brand img {

        width: 44px;

        height: 44px;
    }


    .brand span {

        font-size: 16px;
    }


    /* HAMBURGER */

    .menu-btn {

        display: block;
    }


    /* MOBILE MENU */

    #nav {

        display: none;

        position: absolute;

        top: 68px;

        left: 0;

        width: 100%;

        box-sizing: border-box;

        padding: 18px 20px;

        background: #080808;

        border-top: 1px solid rgba(255,255,255,0.08);

        border-bottom: 1px solid rgba(255,255,255,0.08);

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 18px;

        box-shadow:
            0 12px 30px rgba(0,0,0,0.35);
    }


    /* ये तीनों classes support रहेंगी */

    #nav.show,

    #nav.open,

    #nav.active {

        display: flex;
    }


    #nav a {

        display: block;

        width: 100%;

        text-align: center;

        padding: 6px 0;

        font-size: 16px;
    }


    /* ADMIN BUTTON */

    .admin-panel-btn {

        padding: 11px 18px;

        font-size: 14px;

        margin-top: 18px;
    }


    /* FOOTER */

    footer {

        margin-top: 60px;

        padding: 30px 15px;
    }


    footer a {

        margin: 3px 6px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {


    .brand span {

        font-size: 15px;
    }


    .brand img {

        width: 42px;

        height: 42px;
    }


    .menu-btn {

        font-size: 28px;
    }


    .admin-panel-btn {

        font-size: 13px;

        padding: 10px 16px;
    }


    footer p {

        font-size: 13px;
    }

}


</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="navbar">


        <!-- BRAND -->

        <a href="index.html" class="brand">

            <img
                src="logo.jpeg"
                alt="CG Neel Baghel Logo"
            >

            <span>
                CG Neel Baghel
            </span>

        </a>


        <!-- MOBILE MENU BUTTON -->

        <button
            id="menu"
            class="menu-btn"
            type="button"
            aria-label="Menu"
        >
            ☰
        </button>


        <!-- NAVIGATION -->

        <nav id="nav">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#services">
                Services
            </a>

            <a
                href="blog.html"
                class="active"
            >
                Blog
            </a>

            <a href="index.html#gallery">
                Gallery
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>


    </div>

</header>



<!-- =====================================================
     MAIN BLOG
===================================================== -->

<main class="blog-page">


    <!-- BLOG HEADER -->

    <section class="blog-hero">


        <div class="eyebrow">
            CG NEEL BAGHEL
        </div>


        <h1>

            मेरे लेख
            <span>&amp; ब्लॉग</span>

        </h1>


        <p>

            मेरे विचार, अनुभव, जानकारी और छत्तीसगढ़ से जुड़े लेख।

        </p>


        <!-- ADMIN PANEL -->

        <a
            href="admin.html"
            class="admin-panel-btn"
        >
            🔐 Admin Panel / नया लेख
        </a>


    </section>



    <!-- =================================================
         SEARCH & CATEGORY
    ================================================= -->

    <section class="blog-tools">


        <input
            type="search"
            id="search"
            placeholder="लेख खोजें..."
            autocomplete="off"
        >


        <select id="cat">

            <option value="all">
                सभी श्रेणियाँ
            </option>

        </select>


    </section>



    <!-- =================================================
         BLOG LIST
    ================================================= -->

    <section
        id="posts"
        class="posts"
    >

    </section>



    <!-- =================================================
         SINGLE ARTICLE DETAIL
    ================================================= -->

    <section
        id="detail"
        class="detail"
    >

    </section>


</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>


    <p>

        © 2026 CG Neel Baghel. All Rights Reserved.

    </p>


    <p>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="blog.html">
            Blog
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </p>


</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="posts.js"></script>

<script src="script.js"></script>


</body>

</html>
