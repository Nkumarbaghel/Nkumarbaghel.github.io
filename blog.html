<style>
header{width:100%;position:relative;z-index:9999;background:#080808;border-bottom:1px solid rgba(255,255,255,.08)}
.navbar{width:min(1100px,92%);min-height:68px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:17px;font-weight:700;white-space:nowrap}.brand img{width:44px;height:44px;object-fit:cover;border-radius:50%;display:block}.brand span{color:#fff;font-weight:700}
#nav{display:flex;align-items:center;justify-content:flex-end;gap:26px}#nav a{color:#fff;text-decoration:none;font-size:15px;font-weight:600;transition:.3s}#nav a:hover,#nav a.active{color:#ff2027}
.menu-btn{display:none;width:42px;height:42px;padding:0;border:none;background:transparent;color:#fff;font-size:30px;line-height:42px;text-align:center;cursor:pointer}
.admin-panel-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding:12px 22px;background:#ff1e25;color:#fff!important;border:1px solid #ff1e25;border-radius:10px;text-decoration:none;font-size:15px;font-weight:700;transition:.3s;box-shadow:0 8px 25px rgba(255,30,37,.18)}
.admin-panel-btn:hover{background:transparent;color:#ff1e25!important;transform:translateY(-3px)}
footer{width:100%;margin-top:80px;padding:35px 20px;background:#080808;border-top:1px solid rgba(255,255,255,.08);text-align:center;box-sizing:border-box}footer p{margin:8px 0;color:#aaa;font-size:14px;line-height:1.7}footer a{display:inline-block;margin:0 8px;color:#fff;text-decoration:none;font-size:14px;transition:.3s}footer a:hover{color:#ff2027}
@media(max-width:768px){.navbar{width:92%;min-height:68px;position:relative}.brand img{width:44px;height:44px}.brand span{font-size:16px}.menu-btn{display:block}#nav{display:none;position:absolute;top:68px;left:0;width:100%;box-sizing:border-box;padding:18px 20px;background:#080808;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);flex-direction:column;align-items:center;justify-content:center;gap:18px;box-shadow:0 12px 30px rgba(0,0,0,.35)}#nav.show,#nav.open,#nav.active{display:flex}#nav a{display:block;width:100%;text-align:center;padding:6px 0;font-size:16px}.admin-panel-btn{padding:11px 18px;font-size:14px;margin-top:18px}footer{margin-top:60px;padding:30px 15px}footer a{margin:3px 6px}}
@media(max-width:480px){.brand span{font-size:15px}.brand img{width:42px;height:42px}.menu-btn{font-size:28px}.admin-panel-btn{font-size:13px;padding:10px 16px}footer p{font-size:13px}}
</style>
</head>

<nav id="nav"><a href="index.html">Home</a><a href="index.html#about">About</a><a href="index.html#services">Services</a><a href="blog.html" class="active">Blog</a><a href="index.html#gallery">Gallery</a><a href="index.html#contact">Contact</a></nav>
</div></header>

</html>
