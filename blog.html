<!DOCTYPE html>

<link rel="stylesheet" href="style.css">

<style>

/* ADMIN PANEL BUTTON */

.admin-panel-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    margin-top: 22px;
    padding: 12px 22px;

    background: #ff1e25;
    color: #fff;

    border: 1px solid #ff1e25;
    border-radius: 10px;

    text-decoration: none;
    font-size: 15px;
    font-weight: 700;

    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(255, 30, 37, 0.18);
}

.admin-panel-btn:hover {
    background: transparent;
    color: #ff1e25;
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(255, 30, 37, 0.25);
}


/* MOBILE */

@media (max-width: 600px) {

    .admin-panel-btn {
        width: auto;
        padding: 11px 18px;
        font-size: 14px;
        margin-top: 18px;
    }

}

</style>

</head>
