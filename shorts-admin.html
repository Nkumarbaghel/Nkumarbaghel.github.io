<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Short Video Admin | CG Neel Baghel</title><style>body{margin:0;background:#08090b;color:#fff;font-family:system-ui,Arial}.wrap{max-width:650px;margin:35px auto;padding:20px}.box{background:#111317;border:1px solid #292c32;border-radius:18px;padding:22px;margin-bottom:18px}.input,.file{width:100%;box-sizing:border-box;background:#090a0c;border:1px solid #34373e;color:#fff;border-radius:10px;padding:12px;margin:8px 0 14px}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer;background:#e50914;color:#fff}.ghost{background:#1b1d22;border:1px solid #353840}.status{margin-top:12px;color:#aaa}.ok{color:#55df89}.err{color:#ff6b73}.preview{display:none;width:220px;max-height:390px;object-fit:cover;border-radius:14px;background:#000}.bar{height:8px;background:#27292e;border-radius:99px;overflow:hidden;margin-top:14px}.bar i{display:block;width:0;height:100%;background:#e50914}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}a{color:#fff;text-decoration:none;padding:9px 13px;border:1px solid #333;border-radius:10px}.small{font-size:12px;color:#999;line-height:1.6}</style></head><body><div class="wrap"><div class="box"><div class="top"><div><div style="color:#ff3840;font-size:12px;font-weight:800;letter-spacing:2px">CG NEEL BAGHEL</div><h1>🎬 Short Video Admin</h1></div><a href="admin.html">← Admin</a></div><p class="small">यह सुरक्षित uploader आपके GitHub account को verify करके वीडियो को public Shorts page में जोड़ता है। Token कहीं save नहीं होता।</p><label>GitHub Fine-grained Token<input id="token" class="input" type="password" autocomplete="off" placeholder="github_pat_..."></label><button id="login" class="btn">🔓 Verify GitHub</button><div id="loginStatus" class="status"></div></div><div id="app" class="box" style="display:none"><h2>नया Short Video</h2><label>Video<input id="file" class="file" type="file" accept="video/mp4,video/webm,video/quicktime"></label><label>Title / Caption<input id="title" class="input" maxlength="100" placeholder="जैसे: छत्तीसगढ़ी संस्कृति की झलक"></label><video id="preview" class="preview" controls playsinline></video><br><br><button id="upload" class="btn">🚀 Upload करें</button><div class="bar"><i id="bar"></i></div><div id="status" class="status"></div><div class="links"><a href="shorts.html" target="_blank">👁 Public Shorts</a><a href="index.html" target="_blank">🏠 Website</a></div></div></div><script>(()=>{const REPO='Nkumarbaghel/cgneelbaghel',OWNER='Nkumarbaghel',BRANCH='main',DATA='videos.js',DIR='videos';let token='';const $=id=>document.getElementById(id);function msg(id,t,ok=false){$(id).textContent=t;$(id).className='status '+(ok?'ok':'err')}async function api(path,opts={}){const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref='+BRANCH',{...opts,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.message||'GitHub error');return d}async function verify(){token=$('token').value.trim();if(!token)return msg('loginStatus','Token डालें।');try{const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}),u=await r.json();if(!r.ok)throw Error('Token invalid है।');if(String(u.login).toLowerCase()!==OWNER.toLowerCase())throw Error('⛔ केवल Nkumarbaghel account allowed है।');const repo=await api('');if(repo.permissions&&!repo.permissions.push)throw Error('⛔ Token में Contents write permission नहीं है।');$('app').style.display='block';msg('loginStatus','✅ GitHub verified: '+u.login,true)}catch(e){token='';msg('loginStatus',e.message)}}function b64(s){return btoa(unescape(encodeURIComponent(s)))}function fileB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}function safe(s){return String(s||'short').toLowerCase().replace(/[^a-z0-9-_]+/g,'-').replace(/^-+|-+$/g,'').slice(0,45)||'short'}$('login').onclick=verify;$('file').onchange=()=>{const f=$('file').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};$('upload').onclick=async()=>{const f=$('file').files[0],title=$('title').value.trim();if(!f)return msg('status','पहले वीडियो चुनें।');if(!/^video\/(mp4|webm|quicktime)$/.test(f.type))return msg('status','केवल MP4, WebM या MOV वीडियो चुनें।');if(f.size>20*1024*1024)return msg('status','वीडियो 20 MB से छोटा होना चाहिए।');$('upload').disabled=true;try{msg('status','वीडियो तैयार हो रहा है...',true);$('bar').style.width='15%';const content=await fileB64(f),name=Date.now()+'-'+safe(title||f.name.replace(/\.[^.]+$/,''))+'.'+(f.type==='video/webm'?'webm':'mp4'),path=DIR+'/'+name;await api(path,{method:'PUT',body:JSON.stringify({message:'Add short video: '+name,content,branch:BRANCH})});$('bar').style.width='65%';const old=await api(DATA),raw=decodeURIComponent(escape(atob(old.content.replace(/\n/g,''))));let list=[];try{const m=raw.match(/window\.shortsVideos\s*=\s*(\[[\s\S]*?\]);?/);if(m)list=JSON.parse(m[1])}catch{}list.push({src:path,title:title||'Short Video'});const js='window.shortsVideos = '+JSON.stringify(list,null,2)+';';await api(DATA,{method:'PUT',body:JSON.stringify({message:'Update short video list',content:b64(js),sha:old.sha,branch:BRANCH})});$('bar').style.width='100%';msg('status','✅ Video upload हो गया! Public Shorts में थोड़ी देर में दिखाई देगा।',true);$('file').value='';$('title').value='';setTimeout(()=>$('bar').style.width='0%',1000)}catch(e){$('bar').style.width='0%';msg('status','❌ Upload failed: '+e.message)}finally{$('upload').disabled=false}}})();</script></body></html>
