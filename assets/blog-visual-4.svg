<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#0b0b0d"/><rect x="30" y="30" width="1140" height="590" rx="28" fill="#151518" stroke="#3b3b42"/><text x="70" y="90" fill="#ff3b30" font-size="28" font-weight="700">अब फर्क साफ है</text><text x="70" y="145" fill="#fff" font-size="44" font-weight="800">समय, खर्च और चक्कर — तीनों में राहत</text><g transform="translate(80 210)"><rect width="450" height="280" rx="20" fill="#29252a"/><text x="45" y="65" fill="#ff5b52" font-size="34" font-weight="800">पहले</text><text x="45" y="115" fill="#ddd" font-size="27">गाँव → 15 KM → तहसील</text><text x="45" y="160" fill="#ddd" font-size="27">फाइल → इंतजार → वापसी</text><text x="45" y="205" fill="#ddd" font-size="27">फिर तारीख पर दोबारा जाना</text><text x="45" y="250" fill="#ffcf33" font-size="27" font-weight="700">पूरा दिन निकल सकता था</text></g><path d="M565 350 H635" stroke="#ffcf33" stroke-width="14" stroke-linecap="round"/><path d="M620 320 l45 30 l-45 30" fill="none" stroke="#ffcf33" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(680 210)"><rect width="440" height="280" rx="20" fill="#193124"/><text x="45" y="65" fill="#35d07f" font-size="34" font-weight="800">अब</text><text x="45" y="115" fill="#fff" font-size="27">गाँव → नजदीकी CSC</text><text x="45" y="160" fill="#fff" font-size="27">ऑनलाइन आवेदन</text><text x="45" y="205" fill="#fff" font-size="27">स्थिति की जानकारी</text><text x="45" y="250" fill="#35d07f" font-size="27" font-weight="700">मेरे अनुभव में 10–15 मिनट में शुरुआत</text></g></svg>