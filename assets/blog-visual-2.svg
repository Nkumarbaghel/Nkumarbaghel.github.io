<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#0b0b0d"/><rect x="30" y="30" width="1140" height="590" rx="28" fill="#151518" stroke="#3b3b42"/><text x="70" y="90" fill="#ff3b30" font-size="28" font-weight="700">तहसील में परेशानी</text><text x="70" y="145" fill="#fff" font-size="42" font-weight="800">फाइल खोजो • जानकारी लो • फिर तारीख लो</text><g transform="translate(80 205)"><rect width="520" height="310" rx="20" fill="#24242a"/><rect x="35" y="35" width="450" height="45" rx="8" fill="#3a3a42"/><text x="55" y="66" fill="#fff" font-size="24">फाइल / आवेदन</text><g fill="#8d5a3b"><rect x="40" y="110" width="190" height="28"/><rect x="250" y="110" width="190" height="28"/><rect x="40" y="155" width="190" height="28"/><rect x="250" y="155" width="190" height="28"/><rect x="40" y="200" width="190" height="28"/><rect x="250" y="200" width="190" height="28"/></g><circle cx="410" cy="250" r="42" fill="#ff3b30"/><path d="M390 250 h40 M410 230 v40" stroke="#fff" stroke-width="7"/></g><g transform="translate(690 215)"><circle cx="120" cy="90" r="65" fill="#ffcf33"/><path d="M120 55 v40 l28 18" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/><text x="30" y="190" fill="#fff" font-size="28" font-weight="700">फिर से जाना पड़ सकता था</text><text x="20" y="240" fill="#bbb" font-size="25">2–3 चक्कर</text><text x="20" y="285" fill="#bbb" font-size="25">समय और यात्रा खर्च</text></g></svg>