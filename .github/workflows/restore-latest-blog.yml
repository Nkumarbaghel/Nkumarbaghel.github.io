name: Restore latest blog entry

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'Trigger blog restore')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore accidentally deleted blog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit f4fdecc7b9ecc5fdf3309a75d2c3dc60498980b2
          git rm .github/workflows/restore-latest-blog.yml
          git commit --amend --no-edit
          git push origin HEAD:main
