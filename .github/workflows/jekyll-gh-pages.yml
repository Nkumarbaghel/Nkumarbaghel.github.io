# GitHub Pages deployment for the CG Neel Baghel site
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Keep only the newest deployment request so a stuck older run does not
# keep blocking the next site update.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clear stale Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments?per_page=100" --jq '.[] | select(.status == "in_progress") | .id' 2>/dev/null)
          for id in $ids; do
            echo "Cancelling stale Pages deployment: $id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${id}/cancel" >/dev/null 2>&1 || true
          done
          set -e
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
