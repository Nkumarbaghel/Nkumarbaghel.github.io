#292929;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s}.photo:hover img{transform:scale(1.05)}.empty{text-align:center;padding:50px 20px;color:#999;border:1px dashed #333;border-radius:18px}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:10px}.close{position:fixed;right:18px;top:18px;width:44px;height:44px;border:1px solid #555;background:#111;color:#fff;border-radius:50%;font-size:24px}.note{text-align:center;color:#777;font-size:12px;margin-top:24px}@media(max-width:760px){.gallery{grid-template-columns:repeat(2,1fr)}.wrap{padding-top:30px}}@media(max-width:430px){.gallery{gap:10px}.photo{border-radius:13px}}</style><script type="application/ld+json">{"@context":"https://schema.org","@type":"ImageGallery","name":"CG Neel Baghel Gallery","url":"https://nkumarbaghel.github.io/gallery.html","inLanguage":"hi-IN"}</script></head><body><header class="top"><a class="brand" href="index.html"><img src="logo.jpeg" alt="CG Neel Baghel"><span>CG Neel Baghel</span></a><a class="back" href="index.html">← Home</a></header><main class="wrap"><section class="hero"><div class="ey">CG • DIGITAL • CULTURE</div><h1>मेरी Gallery</h1><p>यहाँ केवल वही photos दिखाई जाएँगी जिन्हें Admin Panel से Gallery में upload किया गया है।</p></section><section id="gallery" class="gallery"></section><div id="empty" class="empty" style="display:none">अभी Gallery में कोई photo upload नहीं की गई है।</div><div class="note">Gallery photos आपके GitHub repository के <b>images/gallery</b> folder से दिखाई जाती हैं।</div></main><div id="lightbox" class="lightbox"><button class="close" id="close">×</button><img id="large" alt="Gallery photo"></div><script>const repo='Nkumarbaghel/cgneelbaghel',folder='images/gallery',gallery=document.getElementById('gallery'),empty=document.getElementById('empty');async function load(){try{const r=await fetch(`https://api.github.com/repos/${repo}/contents/${folder}?ref=main`,{cache:'no-store'});if(!r.ok)throw new Error();const files=await r.json();const imgs=files.filter(x=>x.type==='file'&&/\.(jpe?g|png|webp|gif)$/i.test(x.name)).sort((a,b)=>b.name.localeCompare(a.name));if(!imgs.length){empty.style.display='block';return}gallery.innerHTML=imgs.map(x=>`<div class="photo" data-src="${x.download_url}"><img loading="lazy" src="${x.download_url}" alt="Gallery photo"></div>`).join('');document.querySelectorAll('.photo').forEach(x=>x.onclick=()=>{document.getElementById('large').src=x.dataset.src;document.getElementById('lightbox').classList.add('show')})}catch(e){empty.style.display='block';empty.textContent='Gallery अभी load नहीं हो पाई। थोड़ी देर बाद फिर प्रयास करें।'}}load();document.getElementById('close').onclick=()=>document.getElementById('lightbox').classList.remove('show');document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('show')};</script></body></html>
